<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #050505; color: #ffffff; }

    <div class="max-w-6xl mx-auto">

                        <td class="p-4 font-mono">20.445.XXX</td>

                    </tr>
                    <tr>
                        <td class="p-4 font-bold">MARCO POLO</td>
                        <td class="p-4 text-indigo-400 font-bold">Pasaporte</td>
                        <td class="p-4 font-mono">ITA-998234-L</td>
                        <td class="p-4">Marketing</td>
                        <td class="p-4 text-right"><button class="text-xs font-bold border border-white/10 px-3 py-1 hover:bg-white/10 transition-all">EDITAR</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
